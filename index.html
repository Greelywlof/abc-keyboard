<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ABC 字母乐园</title>
<style>
  :root{
    --bg1:#fff7e0; --bg2:#e3f4ff; --ink:#3b3355; --soft:#8a83a3;
    --key:#ffffff; --key-shadow:#d9d2ea; --hint:#ffd84d; --ok:#5ccf7a; --no:#ff8c8c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink);
    font-family:"Comic Sans MS","Chalkboard SE","Arial Rounded MT Bold","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;user-select:none;
  }
  /* 顶部栏：给家长用 */
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
  header h1{font-size:22px;margin:0 auto 0 0;letter-spacing:1px}
  .tab,.tool{
    border:none;border-radius:999px;padding:8px 16px;font-size:16px;cursor:pointer;
    background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--key-shadow);font-family:inherit
  }
  .tab.on{background:#7c6cf0;color:#fff;box-shadow:0 3px 0 #5646c4}
  .tool{padding:8px 12px}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0}
  #stage{display:flex;align-items:center;justify-content:center;gap:5vw;flex-wrap:wrap;padding:0 16px}
  #letter{
    font-size:min(34vh,30vw);line-height:1;font-weight:bold;
    text-shadow:0 8px 0 rgba(0,0,0,.08);
  }
  #pic{font-size:min(22vh,22vw);line-height:1}
  #letter,#pic,#word,#prompt{cursor:pointer}
  #word{font-size:min(7vh,8vw);margin-top:8px;letter-spacing:2px;min-height:1.2em;text-align:center}
  #word b{font-size:1.25em}
  #cn{font-size:min(3.4vh,5vw);color:var(--soft);min-height:1.3em}
  #prompt{font-size:min(4.5vh,6vw);color:var(--soft);margin-bottom:6px;min-height:1.3em;text-align:center}
  #stars{position:absolute;top:6px;right:16px;font-size:28px;max-width:60vw;text-align:right;word-break:break-all}

  .pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}

  /* 屏幕键盘：和真键盘同样排列，按哪个哪个亮 */
  #kb{padding:10px 8px 16px;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
  .row{display:flex;gap:6px;justify-content:center}
  .k{
    width:min(8.2vw,64px);height:min(8.2vw,64px);border-radius:14px;border:none;
    background:var(--key);box-shadow:0 5px 0 var(--key-shadow);
    font-size:min(4.4vw,30px);font-weight:bold;color:var(--ink);cursor:pointer;font-family:inherit;
    transition:transform .08s, box-shadow .08s, background .2s;
  }
  .k:active,.k.down{transform:translateY(4px);box-shadow:0 1px 0 var(--key-shadow)}
  .k.hint{background:var(--hint);animation:glow 1s infinite alternate}
  @keyframes glow{to{box-shadow:0 5px 0 #e0b400,0 0 0 8px rgba(255,216,77,.45)}}
  .k.space{width:min(40vw,320px)}

  /* 拼单词：每个字母一个格子，敲对的变彩色，当前要敲的那格在跳 */
  #tiles{display:flex;gap:min(1.6vw,12px);justify-content:center;flex-wrap:wrap;margin-top:6px}
  #tiles:empty{display:none}
  .tile{
    width:min(11vw,84px);height:min(13vw,100px);border-radius:16px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:min(8vw,62px);font-weight:bold;
    color:#c9c3dc;box-shadow:0 5px 0 var(--key-shadow);transition:background .2s,color .2s
  }
  .tile.done{color:#fff}
  .tile.now{color:var(--ink);outline:5px solid var(--hint);animation:bob .8s infinite alternate}
  @keyframes bob{to{transform:translateY(-8px)}}
  #timeLeft{font-size:15px;color:var(--soft);white-space:nowrap}
  #timeLeft.low{color:#e8590c;font-weight:bold}
  #micBtn{
    margin-top:10px;border:none;border-radius:999px;padding:12px 28px;font-size:min(4vh,26px);font-family:inherit;
    background:#ff7aa8;color:#fff;box-shadow:0 5px 0 #d94f80;cursor:pointer
  }
  #micBtn[hidden]{display:none}
  #score{font-size:min(5vh,34px);min-height:1.2em;letter-spacing:4px}
  #score small{font-size:.55em;color:var(--soft);letter-spacing:0}
  #word b.weak{color:#e03131;text-decoration:underline;font-size:1.35em}
  #micBtn.rec{background:#e03131;box-shadow:0 5px 0 #a51d1d;animation:glow2 .6s infinite alternate}
  @keyframes glow2{to{transform:scale(1.08)}}
  #rest,#parent{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
  #rest[hidden],#parent[hidden]{display:none}
  #rest{background:linear-gradient(160deg,#dfe7ff,#f3e8ff);flex-direction:column;text-align:center;gap:8px}
  #rest .big{font-size:min(24vh,40vw)}
  #rest h2{font-size:min(6vh,9vw);margin:0}
  #rest p{font-size:min(3.6vh,5vw);color:var(--soft);margin:0}
  .restStats{font-size:min(3.4vh,5vw);margin-top:12px}
  #parent{background:rgba(40,30,70,.45)}
  .panel{background:#fff;border-radius:20px;padding:20px 22px;width:min(640px,100%);max-height:92vh;overflow:auto;position:relative;user-select:text}
  .panel h2{margin:0 0 10px} .panel h3{margin:18px 0 8px;font-size:17px}
  .panel .close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:var(--soft)}
  .panel input{font-size:22px;width:120px;padding:6px 10px;border-radius:10px;border:2px solid var(--key-shadow);margin-right:8px;font-family:inherit}
  .muted{color:var(--soft);font-size:13px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
  .card{background:#f6f3ff;border-radius:14px;padding:10px;text-align:center}
  .card b{display:block;font-size:28px;color:#7c6cf0} .card span{font-size:13px;color:var(--soft)}
  #pWords{margin-top:8px;font-size:14px;color:var(--soft)}
  .bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:18px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--soft)}
  .bar i{display:block;width:100%;max-width:42px;background:#7c6cf0;border-radius:8px 8px 0 0;min-height:2px;position:relative}
  .bar i::before{content:attr(data-n);position:absolute;top:-17px;left:0;right:0;text-align:center;color:var(--ink);font-style:normal;font-size:12px}
  .bar.today i{background:#ff7aa8}
  .limits{display:flex;gap:6px;flex-wrap:wrap}
  .limits .tab{font-size:14px;padding:6px 12px}
  .recRow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px;flex-wrap:wrap}
  .recRow audio{height:32px}
  .confetti{position:fixed;top:-40px;font-size:32px;pointer-events:none;animation:fall linear forwards;z-index:5}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

  #start{
    position:fixed;inset:0;background:rgba(255,247,224,.96);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;z-index:10;cursor:pointer;text-align:center;padding:16px
  }
  #start .big{font-size:min(20vh,30vw)}
  #start .go{font-size:32px;background:#7c6cf0;color:#fff;padding:16px 40px;border-radius:999px;box-shadow:0 6px 0 #5646c4}
  #start p{color:var(--soft);font-size:18px;margin:0}
</style>
</head>
<body>

<div id="start">
  <div class="big">🔤</div>
  <div class="go">▶ 开始玩</div>
  <p>点一下开始（浏览器需要点一下才能出声音）</p>
</div>

<header>
  <h1>🌈 ABC 字母乐园</h1>
  <button class="tab on" data-mode="free">🎹 随便按</button>
  <button class="tab" data-mode="find">🔍 找字母</button>
  <button class="tab" data-mode="spell">✏️ 拼单词</button>
  <span id="timeLeft" title="今天还能玩多久"></span>
  <button class="tool" id="parentBtn" title="家长：统计和设置">👪</button>
  <button class="tool" id="caseBtn" title="大写 / 小写">Aa</button>
  <button class="tool" id="muteBtn" title="声音">🔊</button>
  <button class="tool" id="fsBtn" title="全屏">⛶</button>
</header>

<main>
  <div id="stars"></div>
  <div id="prompt">🔊 按键盘上的任何字母吧！</div>
  <div id="stage">
    <div id="letter">A</div>
    <div id="pic">🍎</div>
  </div>
  <div id="tiles"></div>
  <div id="word"></div>
  <div id="cn"></div>
  <div id="score"></div>
  <button id="micBtn" title="跟我读">🎤 跟我读</button>
</main>

<!-- 时间到了：休息页 -->
<div id="rest" hidden>
  <div class="big">😴</div>
  <h2>🔊 今天的时间用完啦</h2>
  <p>让小眼睛休息一下，明天再来玩吧！</p>
  <div class="restStats" id="restStats"></div>
</div>

<!-- 家长面板：先答一道乘法题才能进（4 岁孩子打不开） -->
<div id="parent" hidden>
  <div class="panel">
    <button class="close" id="pClose">✕</button>
    <div id="gate">
      <h2>👪 家长入口</h2>
      <p>请回答：<b id="gateQ"></b></p>
      <input id="gateA" inputmode="numeric" autocomplete="off">
      <button class="tab on" id="gateOk">进入</button>
    </div>
    <div id="pBody" hidden>
      <h2>📊 今天</h2>
      <div class="cards" id="pToday"></div>
      <div id="pWords"></div>
      <h3>最近 7 天拼对的单词</h3>
      <div class="bars" id="pBars"></div>
      <h3>⏱ 每天能玩多久</h3>
      <div id="pLimit"></div>
      <p class="muted">到时间后会出现休息页，键盘不再响应。时间按页面打开且在前台的时长算，记在这台设备的浏览器里。</p>
      <h3>🎤 这次打开后的跟读录音</h3>
      <div id="pRecs"><p class="muted">还没有录音。录音只保存在这台电脑的内存里，关掉网页就没了。</p></div>
    </div>
  </div>
</div>

<div id="kb"></div>

<script>
// ---------- 字母数据：每个字母两个简单单词，按一次换一个 ----------
// 改单词时同步改 tools/words.json，再跑 node tools/gen-audio.js 重新生成发音
const DATA = {
  A:[["Apple","🍎","苹果"],["Ant","🐜","蚂蚁"]],
  B:[["Ball","⚽","球"],["Bear","🐻","熊"]],
  C:[["Cat","🐱","猫"],["Car","🚗","汽车"]],
  D:[["Dog","🐶","狗"],["Duck","🦆","鸭子"]],
  E:[["Egg","🥚","鸡蛋"],["Elephant","🐘","大象"]],
  F:[["Fish","🐟","鱼"],["Frog","🐸","青蛙"]],
  G:[["Grapes","🍇","葡萄"],["Gift","🎁","礼物"]],
  H:[["Hat","🎩","帽子"],["Horse","🐴","马"]],
  I:[["Ice cream","🍦","冰淇淋"],["Ice","🧊","冰"]],
  J:[["Juice","🧃","果汁"],["Jellyfish","🪼","水母"]],
  K:[["Kite","🪁","风筝"],["Koala","🐨","考拉"]],
  L:[["Lion","🦁","狮子"],["Lemon","🍋","柠檬"]],
  M:[["Moon","🌙","月亮"],["Monkey","🐵","猴子"]],
  N:[["Nose","👃","鼻子"],["Nest","🪺","鸟窝"]],
  O:[["Orange","🍊","橙子"],["Owl","🦉","猫头鹰"]],
  P:[["Pig","🐷","小猪"],["Panda","🐼","熊猫"]],
  Q:[["Queen","👸","女王"],["Quiet","🤫","安静"]],
  R:[["Rabbit","🐰","兔子"],["Rainbow","🌈","彩虹"]],
  S:[["Sun","☀️","太阳"],["Star","⭐","星星"]],
  T:[["Tree","🌳","树"],["Tiger","🐯","老虎"]],
  U:[["Umbrella","☂️","雨伞"],["Unicorn","🦄","独角兽"]],
  V:[["Van","🚐","面包车"],["Violin","🎻","小提琴"]],
  W:[["Whale","🐳","鲸鱼"],["Watermelon","🍉","西瓜"]],
  X:[["Fox","🦊","狐狸"],["Box","📦","盒子"]],
  Y:[["Yo-yo","🪀","悠悠球"],["Yellow","💛","黄色"]],
  Z:[["Zebra","🦓","斑马"],["Zero","0️⃣","零"]],
};
// 让语音读字母名而不是读成单词（如 A 被读成冠词 "uh"）
const SAY = {A:"ay",B:"bee",C:"see",D:"dee",E:"ee",F:"eff",G:"gee",H:"aitch",I:"eye",J:"jay",K:"kay",L:"el",M:"em",
  N:"en",O:"oh",P:"pee",Q:"cue",R:"are",S:"ess",T:"tee",U:"you",V:"vee",W:"double you",X:"ex",Y:"why",Z:"zee"};
const NUM_WORDS = ["zero","one","two","three","four","five","six","seven","eight","nine"];
const NUM_CN = ["零","一","二","三","四","五","六","七","八","九"];
const COLORS = ["#ff6b6b","#ff9f43","#f7b731","#26de81","#2bcbba","#45aaf2","#4b7bec","#a55eea","#fd79a8"];
const PRAISE = ["Great job!","Well done!","Yay!","Super!","You did it!","Awesome!"];

const $ = id => document.getElementById(id);
const letterEl=$("letter"), picEl=$("pic"), wordEl=$("word"), cnEl=$("cn"), promptEl=$("prompt"), starsEl=$("stars");

let mode="free", upper=true, muted=false, idx={}, target=null, hintTimer=null, stars=0, busy=false;
let cur = {L:null, word:null, num:null};   // 当前屏幕上的字母/单词，点一下可以重读

// ---------- 声音 ----------
let voice=null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  // 优先选女声/常见好听的英文语音
  voice = vs.find(v=>/Samantha|Zira|Jenny|Aria|Google US English|Female/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate=0.8, zh="", done, zhAfter=false){
  done = done || (()=>{});
  if (muted || !("speechSynthesis" in window)) return done();
  speechSynthesis.cancel();
  let last=null;
  const sayZh = ()=>{ if (zh){ last = new SpeechSynthesisUtterance(zh); last.lang="zh-CN"; last.rate=0.95; speechSynthesis.speak(last); } };
  if (!zhAfter) sayZh();
  if (text){
    last = new SpeechSynthesisUtterance(text);
    last.lang="en-US"; last.rate=rate; last.pitch=1.15; if (voice) last.voice=voice;
    speechSynthesis.speak(last);
  }
  if (zhAfter) sayZh();   // 「Cat，猫」：英文在前、中文意思在后
  if (!last) return done();
  last.onend = done; last.onerror = done;
  setTimeout(done, 9000); // 有的浏览器不触发 onend，兜底
}
// 中文提示句（和 tools/gen-audio.js 里一致），mp3 缺失时给浏览器中文语音读
const ZH = { zh_free:"按键盘上的任何一个字母吧！", zh_find:"找一找，这个字母在哪里？", zh_try:"不对哦，看看亮起来的那个键！", zh_great:"太棒啦！",
  zh_spell:"跟着屏幕，把这个单词一个一个敲出来！", zh_ye:"耶！", zh_ye_crowd:"耶！",
  zh_follow:"听一听，跟我读！", zh_yourturn:"该你读啦！", zh_hear:"听听你读的。",
  zh_1min:"还可以玩一分钟哦！", zh_rest:"今天的时间用完啦，让小眼睛休息一下，明天再来玩吧！",
  zh_today:"今天你拼对了", zh_words_end:"个单词，真棒！", zh_many:"好多好多",
  zh_score3:"哇，读得真标准！", zh_score2:"很不错！有一个音再读清楚一点就更好啦。", zh_score1:"我们再听一遍，慢慢跟着读。",
  zh_noheard:"没听清楚，大声一点再读一次好吗？", zh_listenpart:"听，这个地方要这样读：" };
const zhText = c => ZH[c] || (/^zh_n_\d+$/.test(c) ? c.slice(5) : "")   // 数字直接给浏览器读
  || (/^c_[A-Z]\d$/.test(c) ? DATA[c[2]][+c[3]][2] : "");                 // 单词的中文意思
const cnClip = w => /^w_[A-Z]\d$/.test(w) ? "c_" + w.slice(2) : null;     // w_C0 → c_C0（Cat → 猫）
// 优先播放 audio/ 里 MiniMax 生成的 mp3（按顺序连播）；文件缺失或播不了，就用浏览器语音读 text
let playing=null, playToken=0;
// 返回一个 Promise：整串播完（或被新的一句打断）时结束，跟读要等示范读完再录
function say(clips, text, rate){
  return new Promise(resolve=>{
    let finished=false; const fin=()=>{ if(!finished){ finished=true; resolve(); } };
    if (muted) return fin();
    const token=++playToken;
    if (playing){ playing.pause(); playing=null; }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    let i=0, fell=false;
    clips = clips.filter(Boolean);
    const zh = clips.map(zhText).join("");
    const zhAfter = clips.length > 0 && !zhText(clips[0]);   // 第一段是英文，中文就放后面读
    const fallback=()=>{ if (fell || token!==playToken) return fin(); fell=true; speak(text, rate, zh, fin, zhAfter); };
    const next=()=>{
      if (token!==playToken || i>=clips.length) return fin();
      const a=new Audio(`audio/${clips[i++]}.mp3`);
      playing=a; a.onended=next; a.onerror=fallback;
      a.play().catch(fallback);
    };
    next();
  });
}
let actx=null;
function beep(freq=660, dur=.12, type="sine"){
  if (muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=.15;
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function chime(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,"triangle"),i*90)); }

// ---------- 画面 ----------
function restart(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function caseOf(L){ return upper ? L : L.toLowerCase(); }
function wordHTML(word, L){
  // 把单词里的这个字母加粗上色，X 在 Fox 里就是结尾那个
  const i = word.toUpperCase().indexOf(L);
  if (i<0) return word;
  return word.slice(0,i)+`<b style="color:${letterEl.style.color}">${word[i]}</b>`+word.slice(i+1);
}
function showLetter(L){
  const list = DATA[L]; idx[L] = ((idx[L] ?? -1)+1) % list.length;
  const [word, emoji, cn] = list[idx[L]];
  letterEl.style.color = COLORS[Math.floor(Math.random()*COLORS.length)];
  letterEl.textContent = caseOf(L);
  cur = {L, word, w:`w_${L}${idx[L]}`};
  picEl.textContent = emoji;
  wordEl.innerHTML = wordHTML(word, L);
  cnEl.textContent = cn;
  restart(letterEl,"pop"); restart(picEl,"pop");
  return word;
}
function showNumber(n){
  letterEl.style.color = COLORS[n % COLORS.length];
  letterEl.textContent = n;
  picEl.textContent = n===0 ? "🫙" : "⭐".repeat(n);
  picEl.style.fontSize = n>3 ? "min(9vh,9vw)" : "";
  wordEl.textContent = NUM_WORDS[n]; cnEl.textContent = NUM_CN[n];
  cur = {L:null, word:NUM_WORDS[n], num:NUM_WORDS[n], w:`n_${n}`};
  restart(letterEl,"pop"); restart(picEl,"pop");
  say([`n_${n}`], NUM_WORDS[n]);
}
function confetti(n=18){
  const bits=["🎉","⭐","🌟","🎈","💖","✨"];
  for(let i=0;i<n;i++){
    const s=document.createElement("div"); s.className="confetti";
    s.textContent=bits[i%bits.length];
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(1.6+Math.random()*1.4)+"s";
    document.body.appendChild(s); setTimeout(()=>s.remove(),3200);
  }
}
function flashKey(L){

// 录一段（默认 3 秒），录音时按钮变红在跳；返回录音 blob。录音记进家长面板的列表
async function recordClip(word, ms = 3000){

  recorder.start(); setTimeout(stopRec, ms);
  await stopped;
  micBtn.classList.remove("rec"); micBtn.textContent = "🎤 跟我读";
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  const url = URL.createObjectURL(blob);
  recs.unshift({ word, url, time: new Date().toTimeString().slice(0,5) }); if (recs.length > 30) URL.revokeObjectURL(recs.pop().url);

}

// ---------- AI 打分：录音转成 16k 单声道 wav → 腾讯云口语评测（云函数 abcsoe）----------
const SOE_URL = "https://zhihuixiaoyua-d5gkkwykq944c4980-1399652577.ap-shanghai.app.tcloudbase.com/abc-soe";
async function toWav16k(blob){
  const buf = await blob.arrayBuffer();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx(); const src = await ctx.decodeAudioData(buf); ctx.close?.();
  const len = Math.max(1, Math.ceil(src.duration * 16000));
  const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext; // 旧版 iPhone Safari 只有带 webkit 前缀的
  const off = new Off(1, len, 16000);
  const node = off.createBufferSource(); node.buffer = src; node.connect(off.destination); node.start();
  let pcm = await new Promise((res, rej) => {        // 旧版 Safari 的 startRendering 不返回 Promise
    off.oncomplete = e => res(e.renderedBuffer.getChannelData(0));
    const p = off.startRendering(); if (p && p.then) p.then(b => res(b.getChannelData(0)), rej);
  });
  // 太小声（几乎没声音）就不送去评测
  let peak = 0; for (let i = 0; i < pcm.length; i += 8) peak = Math.max(peak, Math.abs(pcm[i]));
  if (peak < 0.02) throw new Error("quiet");
  // 剪掉前后的空白，只留读单词那一段（前后各留 0.25 秒，最长 2.2 秒）：
  // 腾讯云 HTTP 接口请求最大约 100KB（11-16 实测），整 3 秒的 wav 转成文字后约 128KB 会被拒（413）
  const th = Math.max(0.02, peak * 0.12);
  let a = 0, b = pcm.length - 1;
  while (a < pcm.length && Math.abs(pcm[a]) < th) a++;
  while (b > a && Math.abs(pcm[b]) < th) b--;
  a = Math.max(0, a - 4000); b = Math.min(pcm.length, b + 4000, a + 35200);
  pcm = pcm.subarray(a, b);
  const out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, 16000, true); out.setUint32(28, 32000, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
  w(36, "data"); out.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++){ const s = Math.max(-1, Math.min(1, pcm[i])); out.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  let bin = ""; const bytes = new Uint8Array(out.buffer);
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
// 返回 { level 0~3, total, weak }，或 { error: 原因 }（页面上小字显示原因，方便家长排查）
async function scoreIt(blob, word){
  let step = "转换录音";
  try {
    if (!blob || blob.size < 500) return { error: `没录到声音（录音 ${blob ? blob.size : 0} 字节），检查麦克风` };
    const audio = await toWav16k(blob);
    step = "连接评测";
    const ctl = window.AbortController ? new AbortController() : null; const tm = setTimeout(() => ctl && ctl.abort(), 25000);
    const r = await fetch(SOE_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ word, audio, format:"wav" }), signal: ctl ? ctl.signal : undefined });
    clearTimeout(tm);
    step = `评测返回 ${r.status}`;
    const j = await r.json();
    if (!j.ok){ console.warn("评测", j.error); return { error: j.error || step }; }
    return j.data;
  } catch(e){
    console.warn("评测失败", step, e);
    if (e && e.message === "quiet") return { level: 0, total: 0, quiet: true };
    return { error: `${step}出错：${(e && (e.name === "AbortError" ? "超时" : e.message)) || e}（${(blob && blob.type) || "未知格式"}）` };
  }
}

// 显示星星、分数，没读准的字母标红；配中文语音鼓励，再（放慢）放一遍示范
async function showScore(r, word, clip){
  if (!r || r.error){
    scoreEl.innerHTML = `<span class="muted">（这次没打上分：${String((r && r.error) || "未知原因").replace(/</g, "&lt;")}）</span>`;
    await say([clip], word, .7);
    return;
  }
  const t = today(); (t.evals = t.evals || []).push({ word, total:r.total, level:r.level, weak: r.weak ? (r.weak.letter || r.weak.phone) : "", t: Date.now() }); saveStats();
  const lv = r.level;
  scoreEl.innerHTML = lv === 0 ? "🔇 没听清楚" : `${"⭐".repeat(lv)}${"☆".repeat(3 - lv)} <small>${r.total} 分</small>`;
  stars += Math.max(1, lv); starsEl.textContent = "⭐".repeat(Math.min(stars,20)) + (stars>20?` ×${stars}`:"");
  // 纠音：评测给出了对应字母，就在单词里把它标红
  const l = r.weak && r.weak.letter ? String(r.weak.letter).toLowerCase() : "";
  const i = l ? word.toLowerCase().indexOf(l) : -1;
  if (lv && lv < 3 && i >= 0) wordEl.innerHTML = `${word.slice(0,i)}<b class="weak">${word.slice(i, i + l.length)}</b>${word.slice(i + l.length)}`;
  if (lv === 0) return say(["zh_noheard"], "");
  if (lv === 3){ chime(); confetti(14); return say(["zh_ye_crowd", "zh_score3"], ""); }
  await say([lv === 2 ? "zh_score2" : "zh_score1"], "");
  if (i >= 0) await say(["zh_listenpart"], "");
  await say([clip], word, .6);
}

  gateAns = a*b; $("gateQ").textContent = `${a} × ${b} = ?`;
  $("gateA").value = ""; $("gate").hidden = false; $("pBody").hidden = true; $("parent").hidden = false;
  setTimeout(()=>$("gateA").focus(), 50);
}
function renderParent(){
  const t = today();
  const card = (n, s) => `<div class="card"><b>${n}</b><span>${s}</span></div>`;
  $("pToday").innerHTML =
    card(t.words.length, "拼对的单词") + card(t.letters, "按的字母") + card(t.finds, "找对的字母") +
    card(t.reads, "跟读次数") + card(Math.floor(t.sec/60), `已玩分钟（共 ${limitMin + t.extra}）`);
  const uniq = [...new Set(t.words)];
  $("pWords").textContent = uniq.length ? `今天拼过：${uniq.join("、")}` : "今天还没有拼单词。";
  // 最近 7 天柱状图
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d; });
  const vals = days.map(d => (stats[dayKey(d)] || {}).words?.length || 0);
  const max = Math.max(1, ...vals);
  $("pBars").innerHTML = days.map((d, i) =>
    `<div class="bar${i===6?" today":""}"><i data-n="${vals[i]}" style="height:${vals[i]/max*100}%"></i>${i===6?"今天":`${d.getMonth()+1}/${d.getDate()}`}</div>`).join("");
  $("pLimit").innerHTML = `<div class="limits">${[5,10,15,20,30].map(m =>
      `<button class="tab${m===limitMin?" on":""}" data-lim="${m}">${m} 分钟</button>`).join("")}
      <button class="tab" id="plus5">今天再加 5 分钟</button></div>`;
  $("pLimit").querySelectorAll("[data-lim]").forEach(b => b.onclick = () => { limitMin = +b.dataset.lim; store.set("abc_limit", limitMin); renderParent(); });
  $("plus5").onclick = () => { today().extra += 5; saveStats(); renderParent(); };
  $("pRecs").innerHTML = recs.length
    ? recs.map(r => `<div class="recRow">${r.time} <b>${r.word}</b> ${r.score ? `${"⭐".repeat(r.score.level) || "没听清"} ${r.score.total}分${r.score.weak && r.score.weak.letter ? ` <span style="color:#e03131">要练：${r.score.weak.letter}</span>` : ""}` : `<span class="muted">没打分</span>`} <audio controls src="${r.url}"></audio></div>`).join("")
    : `<p class="muted">还没有录音。录音只保存在这台电脑的内存里，关掉网页就没了。</p>`;
}
$("parentBtn").addEventListener("click", e => { e.target.blur(); openParent(); });
$("gateOk").addEventListener("click", () => {
  if (+$("gateA").value === gateAns){ $("gate").hidden = true; $("pBody").hidden = false; renderParent(); }
  else { $("gateA").value = ""; $("gateA").placeholder = "不对哦"; }
});
$("gateA").addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") $("gateOk").click(); });
$("pClose").addEventListener("click", () => { $("parent").hidden = true; checkRest(); });

// ---------- 点一下重读：大字母读字母，图片/单词读单词 ----------
// 找字母时没找到之前点大字母或提示语 = 再听一遍题目
const repeatQuestion = ()=>{ if (mode==="find" && target && !busy){ restart(letterEl,"pop"); say(["zh_find", `f_${target}`], `Can you find ${SAY[target]}?`); return true; } };
promptEl.addEventListener("click",()=>{
  if (repeatQuestion()) return;
  if (mode==="spell" && spell && !busy) say(["zh_spell", spell.clip], cur.word);
  else if (mode==="free") say(["zh_free"], "");
});
letterEl.addEventListener("click",()=>{
  if (repeatQuestion()) return;
  if (cur.num) return say([cur.w], cur.num);
  if (cur.L){ restart(letterEl,"pop"); say([`l_${cur.L}`], SAY[cur.L], .7); }
});
const sayWord = ()=>{ if (cur.word){ restart(picEl,"pop"); say([cur.w, cnClip(cur.w)].filter(Boolean), cur.word, .7); } };
picEl.addEventListener("click", sayWord);
wordEl.addEventListener("click", sayWord);

// ---------- 家长按钮 ----------
document.querySelectorAll("header .tab").forEach(t=>t.addEventListener("click",()=>{
  t.blur();
  if (recBusy || resting) return;
  document.querySelectorAll("header .tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
  mode=t.dataset.mode; clearHint(); busy=false;
  tilesEl.innerHTML=""; spell=null; target=null;
  if (mode==="find"){ newTarget(); }
  else if (mode==="spell"){ newSpell(); }
  else {
    promptEl.textContent="🔊 按键盘上的任何字母吧！"; freePress("A");
    setTimeout(()=>{ if (mode==="free" && !recBusy) say(["zh_free"], ""); }, 2600); // 提示语也读出来
  }
}));
$("caseBtn").addEventListener("click",e=>{
  upper=!upper; e.target.textContent = upper ? "Aa" : "aA"; refreshKeys();
  if (mode==="spell" && spell) drawTiles();
  else if (mode==="find" && target) letterEl.textContent = caseOf(target);
  else if (/^[A-Z]$/i.test(letterEl.textContent)) letterEl.textContent = caseOf(letterEl.textContent.toUpperCase());
  e.target.blur();
});
$("muteBtn").addEventListener("click",e=>{ muted=!muted; e.target.textContent = muted?"🔇":"🔊"; if(muted){ speechSynthesis.cancel(); playing?.pause(); } e.target.blur(); });
$("fsBtn").addEventListener("click",e=>{
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();
  e.target.blur();
});
$("start").addEventListener("click",()=>{
  $("start").remove();
  document.documentElement.requestFullscreen?.().catch(()=>{});
  started = true; checkRest();
  if (resting) return;   // 今天的时间已经用完，直接是休息页
  freePress("A");
  setTimeout(()=>{ if (mode==="free" && !recBusy) say(["zh_free"], ""); }, 2600); // 开场后用中文告诉她怎么玩
});
</script>
</body>
</html>
